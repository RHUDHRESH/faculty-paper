name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pip-audit
      - name: System check
        run: python manage.py check
      # The suite is the acceptance spec for the money chain, so every push
      # runs all of it, in parallel. SQLite is the test database; no services
      # are needed -- the suite deliberately runs without a live Scopus,
      # Ollama or bucket, the same way a developer machine does.
      - name: Tests
        run: python manage.py test core -v 1 --parallel 4
      # Report-only for now: the first run will list the pre-existing
      # vulnerable pins, triage them, then drop continue-on-error so a known
      # vulnerability fails the build.
      - name: Dependency audit (report-only)
        run: pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend2/package-lock.json
      - name: Install
        run: npm ci
      # check = the two route/token audits + tsc -b + oxlint, the same gates
      # the repo's own convention treats as "it typechecks and lints clean".
      - name: Check
        run: npm run check
      - name: Unit tests
        run: npm test
      # e2e (Playwright) needs the Django API with seeded data and is run
      # from a workstation against a real backend; wiring it into CI needs a
      # service container and is deliberately not attempted here yet.

  # The harness's own tests: protocol, auth, cancellation, error vocabulary.
  # No weights and no llama.cpp -- the engine is injected as a fake -- so the
  # job installs only the HTTP layer and runs in seconds. Installing the
  # full harness/requirements.txt would compile llama-cpp-python from
  # source, which no CI run needs to do.
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install fastapi httpx pytest
      - name: Tests
        run: python -m pytest test_app.py -q
