# Free Render sleeps after ~15 minutes idle. The first click after that
# waits for a cold boot. Ping often enough that the box stays up.
name: Keep Render awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: curl -fsS --max-time 60 https://faculty-paper-api.onrender.com/api/health
