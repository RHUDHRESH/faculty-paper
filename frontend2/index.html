<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="File, track and pay faculty publication incentives." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Faculty Publication App</title>
    <!-- The theme is resolved before first paint, so a dark page never
         flashes white. Same rule as src/app/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem("theme")
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
