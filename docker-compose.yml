# Local Postgres only. The API runs natively (manage.py runserver, or SQLite
# with no compose at all); production builds backend/Dockerfile on Cloud Run.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: faculty
      POSTGRES_PASSWORD: faculty
      POSTGRES_DB: faculty_django
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faculty -d faculty_django"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
