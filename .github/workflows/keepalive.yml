# Render's free plan puts the API to sleep after 15 minutes without a
# request, and the next visitor then waits 30-60 s for it to boot. A request
# every 10 minutes keeps it awake. One always-on service is ~730 instance
# hours a month, inside the free 750.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the API and the site
        run: |
          curl -fsS -m 90 -o /dev/null -w "api %{http_code} %{time_total}s\n" https://faculty-paper.onrender.com/api/health || true
          curl -fsS -m 30 -o /dev/null -w "site %{http_code} %{time_total}s\n" https://faculty-paper.onrender.com/ || true
