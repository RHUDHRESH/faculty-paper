# Render's free plan puts the API to sleep after 15 minutes without a
# request, and the next visitor waits 30-60 s for it to boot.
#
# GitHub starts scheduled workflows late -- often hours late -- so a job that
# pings once and exits leaves long gaps. Instead each run stays up for most of
# GitHub's 6-hour job limit and pings every 4 minutes, a run is scheduled
# every hour, and `concurrency` keeps exactly one running with the next one
# queued behind it. Whenever GitHub gets round to starting the queued run, the
# previous one is still covering. Public repository: Actions minutes are free.
name: keep-alive

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      # The live address is a repository variable (Settings, Secrets and
      # variables, Actions, Variables: SITE_URL), so moving host is one setting,
      # not a code change. The site rewrites /api to the API, so one ping
      # wakes both.
      - name: Keep the API and the site awake
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://saveetha-publications.onrender.com' }}
        # Keep pinging for the same window, but fail the run if any probe
        # failed. HTTP 200 HTML (Render's wake-up page) is not API health.
        run: python3 scripts/keepalive.py
