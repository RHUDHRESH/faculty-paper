services:
  - type: web
    name: faculty-paper-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # migrate on start so Neon schema never drifts if preDeploy is skipped
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 300
    preDeployCommand: python manage.py migrate --noinput
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: CROSS_SITE_COOKIES
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,faculty-paper-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://faculty-paper.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://faculty-paper.vercel.app"
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: LOG_LEVEL
        value: "INFO"
      - key: DATABASE_URL
        sync: false
      - key: SCOPUS_API_KEY
        sync: false
