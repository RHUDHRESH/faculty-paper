services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: faculty
      POSTGRES_PASSWORD: faculty
      POSTGRES_DB: faculty_django
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faculty -d faculty_django"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-compose-secret}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgresql://faculty:faculty@db:5432/faculty_django
      SCOPUS_API_KEY: ${SCOPUS_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CROSS_SITE_COOKIES: "false"
      SECURE_SSL_REDIRECT: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
