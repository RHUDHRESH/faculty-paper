services:
  - type: web
    name: faculty-paper-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # migrate on start so Neon schema never drifts if preDeploy is skipped;
    # start.sh also launches the django-q2 job worker beside gunicorn.
    startCommand: bash scripts/start.sh
    preDeployCommand: python manage.py migrate --noinput
    healthCheckPath: /api/health
    # Claim evidence is written to disk. Without a mounted volume it lives on the
    # container filesystem and is wiped by every deploy and restart, so uploaded
    # proofs disappear while the tickets still list them. Render disks need a
    # paid instance type; on the free plan use object storage instead and point
    # DJANGO_MEDIA_ROOT at the mount.
    disk:
      name: claim-media
      mountPath: /var/data/media
      sizeGB: 5
    envVars:
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: CROSS_SITE_COOKIES
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,faculty-paper-api.onrender.com"
      # The live frontend deploys under the rhudhreshs-projects Vercel scope;
      # the bare faculty-paper.vercel.app project belongs to another account
      # and is stale — kept in the list only until it is retired.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://faculty-paper-rhudhreshs-projects.vercel.app,https://faculty-paper.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://faculty-paper-rhudhreshs-projects.vercel.app,https://faculty-paper.vercel.app"
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: LOG_LEVEL
        value: "INFO"
      - key: DATABASE_URL
        sync: false
      - key: SCOPUS_API_KEY
        sync: false
