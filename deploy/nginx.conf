# The college's one origin: the SPA on /, the API behind /api and /media.
# The proxy is what makes cookies first-party and CORS unnecessary — the same
# arrangement the Vercel deployment gets from its rewrites.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Built assets are content-hashed, so they may be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI features stream tokens for up to a couple of minutes.
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 25m;
    }

    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        client_max_body_size 25m;
    }

    # The SPA: every other path is index.html and the router takes it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
